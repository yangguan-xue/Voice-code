[package]
name = "voice-code-desktop"
version = "0.1.0"
description = "语码 desktop shell"
authors = ["Voice Code Contributors"]
edition = "2021"
license = "AGPL-3.0"

[lib]
name = "voice_code_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
keyring = { version = "4.1.5", default-features = false, features = ["v1", "windows-native-keyring-store", "apple-native-keyring-store"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
