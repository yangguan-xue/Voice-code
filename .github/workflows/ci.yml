name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  lint:
    name: lint (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: uv sync --dev
      - run: uv run ruff check .

  types:
    name: types (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: uv sync --dev
      - name: Python compile smoke
        run: uv run python -m compileall -q src tests

  tests:
    name: tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install ripgrep
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get update
            sudo apt-get install -y ripgrep
          elif [ "$RUNNER_OS" = "macOS" ]; then
            brew install ripgrep
          fi
      - run: uv sync --dev
      - run: uv run pytest tests/ -q

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install ripgrep
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep
      - run: uv sync --dev
      - run: uv add --dev pytest-cov
      - run: uv run pytest tests/ --cov=voice_code --cov-report=term --cov-report=xml
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml

  secret-scan:
    name: secret-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: detect-secrets scan
        run: |
          uvx detect-secrets scan \
            --exclude-files '(^|[\\/])(uv\.lock|web[\\/]pnpm-lock\.yaml|desktop[\\/]pnpm-lock\.yaml|desktop[\\/]src-tauri[\\/]Cargo\.lock)$|(^|[\\/])(web|desktop)[\\/]node_modules[\\/]|(^|[\\/])(web|desktop)[\\/]dist[\\/]|(^|[\\/])desktop[\\/]src-tauri[\\/]target[\\/]' \
            --exclude-lines 'api_key_env|STEPFUN_API_KEY|Bearer \{self\._api_key\}|sk-secret-value|sk-plaintext|sk-thisisasecretvalue|private-token|secret-token|test-token|bad-token|temporary-test-secret|not-needed|replace-with-your|top-secret|top-secret-value|override-key|env-secret|secret-value|test-secret|private-extraction-key|private-key|"apiKey": "secret"' \
            --force-use-all-plugins > .secrets.baseline
      - name: fail on detected secrets
        run: |
          uv run python - <<'PY'
          import json
          import sys

          with open(".secrets.baseline", encoding="utf-8") as handle:
              baseline = json.load(handle)
          results = baseline.get("results", {})
          if results:
              for filename, findings in results.items():
                  lines = ", ".join(str(item.get("line_number", "?")) for item in findings)
                  print(f"{filename}: {lines}")
              sys.exit("detect-secrets found unaudited findings")
          PY
      - name: scan token patterns
        run: |
          uv run python - <<'PY'
          import re
          import subprocess
          import sys
          from pathlib import Path

          skipped = {
              ".env.example",
              "uv.lock",
              "web/pnpm-lock.yaml",
              "desktop/pnpm-lock.yaml",
              "desktop/src-tauri/Cargo.lock",
          }
          allowed_fragments = {
              "sk-secret-value",
              "sk-plaintext",
              "sk-thisisasecretvalue",
              "private-token",
              "secret-token",
              "test-token",
              "bad-token",
              "temporary-test-secret",
              "not-needed",
              "replace-with-your",
              "top-secret",
              "top-secret-value",
              "override-key",
              "env-secret",
              "secret-value",
              "test-secret",
              "private-extraction-key",
              "private-key",
          }
          pattern = re.compile(r"""(?i)(api_key|authorization|token)\s*[=:]\s*["']([^"'<>]{12,})["']""")
          files = subprocess.check_output(["git", "ls-files"], text=True).splitlines()
          findings: list[str] = []
          for raw_path in files:
              path = raw_path.replace("\\", "/")
              if path in skipped:
                  continue
              text = Path(raw_path).read_text(encoding="utf-8", errors="ignore")
              for line_number, line in enumerate(text.splitlines(), start=1):
                  match = pattern.search(line)
                  if not match:
                      continue
                  value = match.group(2)
                  if any(fragment in value for fragment in allowed_fragments):
                      continue
                  findings.append(f"{path}:{line_number}: token-like literal")
          if findings:
              print("\n".join(findings))
              sys.exit(1)
          PY

  license-scan:
    name: license-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: uv sync --dev
      - run: uvx pip-licenses --fail-on 'GPL;AGPL;LGPL;SSPL;BUSL' --format=markdown --with-authors --with-urls --output-file license-report.md
      - uses: actions/upload-artifact@v4
        with:
          name: license-report
          path: license-report.md

  build:
    name: build
    runs-on: ubuntu-latest
    needs: [types, tests, coverage, secret-scan, license-scan]
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: uv sync --dev
      - run: uv build
      - run: shasum -a 256 dist/* > checksum.txt
      - run: uvx cyclonedx-py environment --output-file sbom.cdx.json
      - run: uvx sigstore sign --yes dist/*.whl
        if: github.event_name != 'pull_request'
      - uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: |
            dist/*
            checksum.txt
            sbom.cdx.json
            dist/*.sigstore*
          if-no-files-found: error

  smoke:
    name: smoke
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v5
        with:
          name: release-artifacts
          path: artifacts
      - run: uv sync --dev --extra milvus
      - run: uv run python .github/scripts/ci_smoke.py
      - run: uv run reasoning --plain --help
